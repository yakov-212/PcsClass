<!-- put this last since its so long -->
<style>
    .wheel{
    animation-name: wheel;
    animation-duration: 10s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    border: 2px solid red;
    border-radius: 50%;
    margin-left: 50px;
    position: absolute;
    height: 20vw;
    width: 20vw;
    max-width: 500px;
    max-height: 500px;
}
.line{
    background-color: red;
    animation: line 10s ease-in-out infinite;
    width: 50%;
    height: 2px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 0% 0%;
}
.line:nth-of-type(2){
    transform: rotate(60deg);
}
.line:nth-of-type(3){
    transform: rotate(120deg);
}
.line:nth-of-type(4){
    transform: rotate(180deg);
}
.line:nth-of-type(5){
    transform: rotate(240deg);
}
.line:nth-of-type(6){
    transform: rotate(300deg);
}
.cabin{
    animation: cabins 10s ease-in-out infinite; 
    background-color: red;
    width:20%;
    height: 20%;
    position: absolute;
    border: 2px solid;
    transform-origin: 50% 0%;
}
.cabin:nth-of-type(1){
    right:-8.5%;
    top: 50%;
}
.cabin:nth-of-type(2){
    right:17%;
    top: 93.5%;
}
.cabin:nth-of-type(3){
    right:67%;
    top: 93.5%;
}
.cabin:nth-of-type(4){
    left:-8.5%;
    top: 50%;
}
.cabin:nth-of-type(5){
    left:17%;
    top: 7%;
}
.cabin:nth-of-type(6){
    right:17%;
    top: 7%;
}
@keyframes wheel {
    0%{
        transform: rotate(0deg);
    }
    25%{
        border-color: orange;
    }
    50%{border-color: yellow;}
    75%{border-color: violet;}
    100%{
        transform: rotate(360deg);
      }
}
@keyframes cabins {
    0%{
        transform: rotate(0deg);
    }
    25%{
        background-color: orange;
    }
    50%{background-color: yellow;}
    75%{background-color: violet;}
    100%{
        transform: rotate(-360deg);    
    }
}
@keyframes line {
    25%{
        background-color: orange;
    }
    50%{background-color: yellow;}
    75%{background-color: violet;}
}

</style>
</html>
