<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      html,
      body,
      #sidebar,
      #main {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: 3fr 1fr;
      }

      #sidebar {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        background-color: maroon;
        
      }
       .img-cont{
        display: flex;
        flex: 1;
        border: 2px solid #555;
        justify-content: center;
        align-items: center;
        cursor:pointer;
        
      }
      .img-cont:hover{
        position: relative;
        box-shadow: 0px 60px 25px rgba(0, 0, 0, 0.3);
        transform: translateY(-20px);
      }
      
      #main {
        background-image: url('media/images/background.png');
        background-repeat: no-repeat;
        background-size: cover;
        
      }
      #trash{
        position: absolute;
        cursor: pointer;
        right: 0;
        margin: 50;
        z-index: 3;
      }
      #menu-screen{
        background-color: grey;
        width:1000px;
        height: 500px;
        justify-self: center;
        display:flex;
        flex-direction: column;
        justify-items: center;
        align-items: center;
        

      }
      .menu-section{
        flex: 1;
        display:flex;
        align-items: center;
      }
      .menu-section-button{
        min-height: 40px;
        min-width: 272px;
        font-size: 3em;
        border-radius: 20px;
      }

    </style>
</head>
<body>
  <div id="main">
    
        <audio src="media/music/sunshine-kid-playtime-286890.mp3" loop autoplay></audio>
        <button id="music">Play</button>
        <button id="menu">menu</button>
        <img id="trash" src="media/images/closed.png" 
     onmouseover="this.src='media/images/opened.png'" 
     onmouseout="this.src='media/images/closed.png'">
     <!-- <div id="menu-screen">
      <div class="menu-section"><button class="menu-section-button" id="start">start</button></div>
      <div class="menu-section"><button class="menu-section-button" id="background">Background</button></div>
      <div class="menu-section"><button class="menu-section-button" id="music">Music</button></div>
      <div class="menu-section"><button class="menu-section-button" id="controls">Controls</button></div>
     </div> -->
    </div>
    <div id="sidebar">
      <div class="img-cont"><img id="0" class="potato" left=""></div>
      <div class="img-cont"><img id="0" class="eye"></div>
      <div class="img-cont"><img id="0" class="mouth"></div>
      <div class="img-cont"><img id="0" class="nose"></div>
      <div class="img-cont"><img id="0" class="ear"></div>
      <div class="img-cont"><img id="0" class="feet"></div>
      <div class="img-cont"><img id="0" class="hat"></div>
      <div class="img-cont"><img id="0"class="glasses"></div>
      <div class="img-cont"><img id="0" class="mustache"></div>
      <div class="img-cont"><img id="0" class="arm"></div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
