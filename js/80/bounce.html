<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            padding:0;
            margin: 0;
            height: 100%;
            width: 100%;
        }
        body{position: relative;}
        #can{
            position:absolute;
            display: block;
            pointer-events: none;
        }
        input{
            max-width: 40px;
        }

    </style>
      
</head>
<body>
    <canvas id="can"></canvas>
    <label for="speed">Speed:</label>
    <input type="number" id="speed" value='3' min="1" max="100">
    <label for="angle">angel:</label>
    <input type="number" id="angle" value='1' min="1" max="10">
    <label for="color">color:</label>    
    <input type="color" id="color" value='#0000FF'>
    <button id="add">Add</button>
    <script src="bounce.js"></script>
</body>
</html>
